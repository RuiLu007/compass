<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="{{subtitle}}" />
    <title>{{title}} · {{brand}}</title>
    <!-- prettier-ignore -->
    <style>{{styles}}</style>
  </head>
  <body>
    <a class="skip" href="#document">跳至设计正文</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#top"
          >{{brand}}<span>ENGINEERING<br />DESIGN NOTES</span></a
        >
        <nav class="top-links" aria-label="快捷导航">
          {{navigation}}
          <button class="search-trigger" type="button" data-search aria-label="检索文档">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 5 5" />
            </svg>
            <span>检索文档</span><kbd>⌘ K</kbd>
          </button>
        </nav>
      </div>
      <div class="reading-progress" aria-hidden="true"></div>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span class="dash"></span>TECHNICAL DESIGN / HUMAN REVIEW</div>
        <div class="hero-grid {{heroClass}}">
          <div class="hero-copy">
            <h1 id="page-title">{{title}}<span>{{subtitle}}</span></h1>
            <div class="hero-topics">{{topics}}</div>
            <div class="hero-actions">
              <a class="primary-link" href="{{start}}"
                >从目标开始阅读 <span aria-hidden="true">→</span></a
              >
            </div>
            <div class="hero-note"><span class="status-dot"></span>{{label}}</div>
          </div>
          {{hero}}
        </div>
        {{metrics}}
      </section>
      <div class="doc-layout"><article class="document" id="document">{{article}}</article></div>
    </main>
    <footer class="footer">
      <span>{{brand}} · {{label}}</span><span>单文件 · 离线阅读 <a href="#top">返回顶部 ↑</a></span>
    </footer>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="dialog-header">
        <h2 id="search-title">检索设计与代码</h2>
        <button class="close-button" type="button" data-close aria-label="关闭检索">×</button>
      </div>
      <div class="search-field">
        <input
          id="search-input"
          aria-label="搜索章节、类型或设计内容"
          placeholder="输入章节、类型或关键词…"
          autocomplete="off"
        />
      </div>
      <div id="search-results"></div>
      <p class="search-meta" id="search-meta" role="status"></p>
    </dialog>
    <dialog id="diagram-dialog" aria-labelledby="zoom-title">
      <div class="dialog-header">
        <h2 id="zoom-title">设计图</h2>
        <button class="close-button" type="button" data-close aria-label="关闭图表">×</button>
      </div>
      <div class="zoom-toolbar">
        <button class="plain-button" type="button" data-zoom="out" aria-label="缩小图表">−</button>
        <output id="zoom-level" aria-label="缩放比例">100%</output>
        <button class="plain-button" type="button" data-zoom="in" aria-label="放大图表">+</button>
        <button class="plain-button" type="button" data-zoom="fit">适应窗口</button>
        <button class="plain-button" type="button" data-zoom="actual">原始尺寸</button>
        <button class="plain-button" type="button" id="download-svg">下载 SVG</button>
        <span class="zoom-hint">可横向、纵向滚动 · Esc 关闭</span>
      </div>
      <div id="zoom-viewport" tabindex="0" aria-label="图表滚动区域">
        <div id="zoom-content"></div>
      </div>
    </dialog>
    <div class="toast" role="status" aria-live="polite"></div>
    <!-- prettier-ignore -->
    <script type="application/json" id="document-data">{{payload}}</script>
    <!-- prettier-ignore -->
    <script>{{interactions}}</script>
  </body>
</html>
