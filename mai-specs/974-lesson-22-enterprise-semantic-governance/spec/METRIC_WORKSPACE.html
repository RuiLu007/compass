<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>指标口径 · Compass</title>
    <style>
      :root {
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --font-code: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --canvas: #f8f9f6;
        --surface: #fff;
        --surface-subtle: #f3f6f2;
        --ink: #202b27;
        --muted: #62716a;
        --primary: #1c5145;
        --primary-hover: #153e35;
        --primary-soft: #e5eee7;
        --border: #dce2da;
        --border-strong: #788b80;
        --danger: #a34236;
        --danger-soft: #fff4f1;
        --warning: #745018;
        --warning-soft: #fff4de;
        --focus-ring: #28725e;
        --side-w: 250px;
        --rail-w: 54px;
        --header-h: 60px;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        background: transparent;
      }
      button:disabled {
        cursor: not-allowed;
      }
      a {
        color: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      input:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      button,
      input,
      textarea,
      select {
        accent-color: var(--primary);
      }
      [hidden] {
        display: none !important;
      }
      .sr-only,
      .skip-link:not(:focus) {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
      .skip-link:focus {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 100;
        padding: 8px 16px;
        border-radius: 6px;
        background: #fff;
      }
      .glyph {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .layout {
        min-height: 100vh;
      }
      .side {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--side-w);
        display: grid;
        grid-template-columns: var(--rail-w) 1fr;
        z-index: 10;
      }
      .rail {
        display: flex;
        align-items: center;
        flex-direction: column;
        padding: 13px 0;
        background: #f0f3ee;
        border-right: 1px solid #dfe5dc;
      }
      .brand-mark {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        color: white;
        background: var(--primary);
        border-radius: 11px;
        box-shadow: 0 2px 5px #123c2b1a;
      }
      .rail-center {
        display: grid;
        gap: 8px;
        margin-top: 28px;
      }
      .rail-center a,
      .rail-help,
      .mobile-hide,
      #showNav {
        width: 40px;
        height: 40px;
        border: 0;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: #52665b;
      }
      .rail-center a[aria-current] {
        background: #dce8db;
        color: var(--primary);
        position: relative;
      }
      .rail-center a[aria-current]::before {
        content: "";
        position: absolute;
        left: -7px;
        background: var(--primary);
        width: 3px;
        height: 17px;
        border-radius: 0 3px 3px 0;
      }
      .rail-center a:hover,
      .rail-help:hover,
      #showNav:hover,
      .mobile-hide:hover {
        background: var(--primary-soft);
      }
      .rail-help {
        margin-top: auto;
      }
      .nav-pane {
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #f5f7f2;
        border-right: 1px solid var(--border);
      }
      .nav-brand {
        height: var(--header-h);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        color: #234437;
        font-size: 23px;
        font-weight: 680;
        letter-spacing: -1px;
      }
      .nav-body {
        padding: 22px 10px 8px;
      }
      .nav-lbl {
        font-size: 12px;
        font-weight: 600;
        color: #647267;
        margin: 0 10px 7px;
      }
      .nav-lbl.after {
        border-top: 1px solid #dde5da;
        margin: 24px 0 7px;
        padding: 22px 10px 0;
      }
      .nav-body a {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 11px;
        margin-bottom: 3px;
        border-radius: 8px;
        text-decoration: none;
        color: #4e6055;
        font-weight: 500;
      }
      .nav-body a i,
      .workspace-icon,
      .crumb i,
      .top-right {
        display: inline-flex;
        align-items: center;
      }
      .nav-body a[aria-current] {
        background: #e0eadd;
        color: #1b4c39;
        font-weight: 650;
      }
      .nav-body a:hover {
        background: #e8eee4;
      }
      .workspace-card {
        margin: auto 12px 16px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 12px 3px 0;
        border-top: 1px solid var(--border);
      }
      .workspace-icon {
        width: 32px;
        height: 32px;
        justify-content: center;
        background: #e5ece2;
        border: 1px solid #d8e0d4;
        border-radius: 8px;
        color: #415748;
      }
      .workspace-card strong,
      .workspace-card small {
        display: block;
      }
      .workspace-card strong {
        font-size: 13px;
      }
      .workspace-card small {
        font-size: 12px;
        color: var(--muted);
      }
      .surface-main {
        margin-left: var(--side-w);
        min-width: 0;
      }
      .app-header {
        height: var(--header-h);
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 clamp(16px, 2.7vw, 40px);
        position: relative;
        z-index: 4;
      }
      .crumb,
      .top-right {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .crumb {
        font-size: 13px;
        color: var(--muted);
      }
      .crumb strong {
        font-weight: 550;
        color: var(--ink);
      }
      .crumb i {
        color: #8b978e;
      }
      .top-right {
        font-size: 13px;
        gap: 9px;
      }
      .demo-badge {
        border: 1px solid #dce4d8;
        background: #f5f8f1;
        border-radius: 20px;
        padding: 3px 9px;
        color: #496047;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
      }
      .demo-badge span {
        height: 6px;
        width: 6px;
        border-radius: 50%;
        background: #719064;
      }
      .top-divider {
        height: 17px;
        width: 1px;
        background: var(--border);
        margin: 0 4px;
      }
      .avatar {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #eadfce;
        color: #644f35;
        font-size: 12px;
        font-weight: 600;
      }
      .user-name {
        font-weight: 550;
      }
      .identity-switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 3px 7px;
        min-height: 44px;
        color: var(--ink);
        border-radius: 9px;
        cursor: pointer;
      }
      .identity-switch:hover {
        background: #f4f6f1;
      }
      .identity-switch:focus-within {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .identity-switch i {
        display: flex;
        color: var(--muted);
      }
      .identity-switch select {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .identity-text {
        display: grid;
        gap: 2px;
        line-height: 1.2;
        text-align: left;
      }
      .identity-text strong {
        font-size: 13px;
        font-weight: 600;
      }
      .identity-text small {
        font-size: 11px;
        color: var(--muted);
      }
      @media (max-width: 540px) {
        .identity-switch {
          gap: 4px;
          padding: 0 2px;
        }
        .identity-text strong {
          display: none;
        }
        .identity-text small {
          font-size: 12px;
        }
        .identity-switch .avatar {
          display: none;
        }
      }
      .info-pop {
        position: fixed;
        z-index: 30;
        right: 20px;
        top: 57px;
        max-width: min(320px, calc(100vw - 30px));
        padding: 16px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 35px #2030271b;
      }
      .info-pop p {
        margin: 7px 0 12px;
        color: var(--muted);
      }
      .info-pop button {
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 7px;
      }
      .mobile-hide,
      #showNav {
        display: none;
      }
      .nav-scrim {
        display: none;
      }
      main {
        min-width: 0;
      }
      main:focus:not(:focus-visible) {
        outline: none;
      }
      body.chat-mode {
        background: #fbfcfa;
      }
      .chat-page {
        height: calc(100dvh - var(--header-h));
        display: flex;
        flex-direction: column;
      }
      .chat-history {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .chat-wrap,
      .compose-wrap {
        width: min(100% - 56px, 810px);
        margin: 0 auto;
      }
      .chat-wrap {
        padding: 21px 0 28px;
      }
      .chat-day {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #6c786f;
        font-size: 12px;
        margin-bottom: 17px;
      }
      .chat-day:before,
      .chat-day:after {
        content: "";
        height: 1px;
        background: #e5eae1;
        flex: 1;
      }
      .u-line {
        display: flex;
        justify-content: flex-end;
        margin: 10px 0 15px;
      }
      .u-text {
        display: inline-block;
        max-width: 88%;
        padding: 10px 15px;
        border-radius: 14px 14px 3px 14px;
        background: #e8f0e4;
        color: #213f34;
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .assistant-head {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #244438;
        font-size: 14px;
        font-weight: 650;
        margin: 11px 0;
      }
      .assistant-emblem {
        color: white;
        background: var(--primary);
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 8px;
      }
      .run-line {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0;
      }
      .compose-block {
        padding: 9px 0 16px;
        background: linear-gradient(0deg, #fbfcfa 90%, #fbfcfaee);
        border-top: 1px solid #e3e8df;
      }
      .compose-wrap {
        position: relative;
      }
      .composer {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #bfccbf;
        border-radius: 13px;
        background: white;
        padding: 7px 8px 7px 15px;
        box-shadow: 0 2px 8px #24443408;
      }
      .composer:focus-within {
        border-color: var(--focus-ring);
      }
      .composer textarea {
        flex: 1;
        resize: none;
        min-width: 0;
        border: none;
        outline: 0 !important;
        padding: 5px 0;
        background: transparent;
        line-height: 1.45;
        height: 34px;
        font-size: 15px;
      }
      .composer button {
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 9px;
        background: var(--primary);
        color: white;
        display: grid;
        place-items: center;
      }
      .composer button:disabled {
        background: #e4eae2;
        color: #79877c;
      }
      .composer-note {
        min-height: 0;
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .composer-note:empty {
        display: none;
      }
      @media (min-width: 1600px) {
        :root {
          --side-w: 284px;
          --rail-w: 60px;
        }
      }
      @media (max-width: 1140px) and (min-width: 901px) {
        :root {
          --side-w: 220px;
          --rail-w: 48px;
        }
        .nav-body a {
          padding-left: 9px;
          font-size: 13px;
        }
      }
      @media (max-width: 900px) {
        :root {
          --side-w: 0px;
          --header-h: 54px;
        }
        .side {
          display: none;
          width: min(290px, 85vw);
          grid-template-columns: 50px 1fr;
        }
        .side.mobile-open {
          display: grid;
          z-index: 23;
        }
        .nav-scrim:not([hidden]) {
          display: block;
          position: fixed;
          inset: 0;
          border: 0;
          background: #152d224d;
          z-index: 22;
        }
        .mobile-hide,
        #showNav {
          display: grid;
        }
        .app-header {
          padding: 0 12px 0 6px;
        }
        .crumb {
          gap: 6px;
        }
        .nav-brand {
          padding: 0 10px 0 16px;
        }
        .top-right {
          gap: 6px;
        }
        .chat-wrap,
        .compose-wrap {
          width: min(100% - 32px, 790px);
        }
      }
      @media (max-width: 540px) {
        .user-name,
        .top-divider {
          display: none;
        }
        .top-right {
          gap: 7px;
        }
        .crumb {
          font-size: 12px;
        }
        .demo-badge {
          font-size: 12px;
          padding: 2px 6px;
        }
        .avatar {
          width: 26px;
          height: 26px;
        }
        .chat-wrap,
        .compose-wrap {
          width: calc(100% - 24px);
        }
        .chat-wrap {
          padding: 12px 0 22px;
        }
        .chat-day {
          margin-bottom: 10px;
        }
        .u-text {
          font-size: 14px;
        }
        .compose-block {
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        .composer button,
        .rail-center a,
        .rail-help,
        #showNav,
        .mobile-hide {
          min-height: 44px;
          min-width: 44px;
        }
        .demo-badge {
          min-height: 40px;
        }
        .nav-body {
          padding-top: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation-duration: 0.01ms !important;
        }
      }

      .reset-actions {
        display: flex;
        gap: 8px;
      }
      .reset-actions #resetDemo {
        color: var(--muted);
        border-color: transparent;
      }
      .reset-actions #clearDemo {
        color: var(--danger);
        border-color: #dbc4bd;
      }
      .info-pop #resetConfirm {
        margin-top: 12px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
      }

      .rg-app {
        --rg-line: #dde4dd;
        --rg-soft: #f2f6f0;
        --rg-ink: #202d27;
        --rg-green: #1c5145;
        --rg-muted: #62716a;
        width: 100%;
        max-width: 1570px;
        min-width: 0;
        margin: 0 auto;
        padding: 30px clamp(20px, 2.5vw, 40px) 40px;
        color: var(--rg-ink);
        font-family: var(
          --font,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif
        );
        font-size: 14px;
        line-height: 1.55;
      }
      .rg-app * {
        box-sizing: border-box;
      }
      .rg-app button,
      .rg-app input,
      .rg-app select,
      .rg-app textarea {
        font: inherit;
        color: inherit;
      }
      .rg-app button {
        cursor: pointer;
      }
      .rg-app :focus-visible {
        outline: 2px solid #29705a;
        outline-offset: 3px;
      }
      .rg-app h1,
      .rg-app h2,
      .rg-app h3,
      .rg-app h4,
      .rg-app p,
      .rg-app dl,
      .rg-app dd,
      .rg-app ol {
        margin: 0;
      }
      .rg-app h1 {
        font-size: clamp(26px, 2.4vw, 34px);
        line-height: 1.2;
        font-weight: 680;
        letter-spacing: -0.05em;
      }
      .rg-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 21px;
      }
      .rg-head p {
        font-size: 13px;
        color: var(--rg-muted);
        margin-top: 7px;
      }
      .rg-app .rg-btn {
        min-height: 38px;
        border: 1px solid #ccd6cd;
        padding: 8px 13px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: white;
        color: var(--rg-green);
        font-size: 13px;
        font-weight: 620;
        line-height: 1.4;
        white-space: nowrap;
      }
      .rg-app .rg-btn:hover {
        background: #f1f5ef;
        border-color: #8ea598;
      }
      .rg-app .rg-primary {
        background: var(--rg-green);
        border-color: var(--rg-green);
        color: white;
        box-shadow: 0 2px 3px #1c514516;
      }
      .rg-app .rg-primary:hover {
        background: #153f35;
        color: white;
      }
      .rg-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0 0 20px;
      }
      .rg-app .rg-stat {
        position: relative;
        text-align: left;
        min-height: 88px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 15px 17px;
        border: 1px solid var(--rg-line);
        border-radius: 12px;
        background: #fff;
        color: var(--rg-ink);
      }
      .rg-app .rg-stat:hover {
        background: #f9fbf8;
        border-color: #aabdad;
      }
      .rg-stat-icon,
      .rg-symbol {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .rg-stat-icon {
        width: 37px;
        height: 37px;
        border-radius: 10px;
        background: #e6efe6;
        color: #286148;
      }
      .rg-stat-live .rg-stat-icon {
        background: #eaf0f5;
        color: #49647d;
      }
      .rg-stat-drafts .rg-stat-icon {
        background: #f5eee3;
        color: #85683b;
      }
      .rg-stat-meta {
        display: flex;
        flex-direction: column;
        gap: 1px;
        align-items: flex-start;
        white-space: nowrap;
      }
      .rg-stat-meta > span {
        font-size: 12px;
        color: #55665c;
        font-weight: 560;
      }
      .rg-stat-meta strong {
        font-size: 26px;
        line-height: 1.06;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .rg-app .rg-stat small {
        color: #607169;
        font-size: 11px;
        font-weight: 450;
        white-space: normal;
        align-self: end;
      }
      .rg-live:empty {
        display: none;
      }
      .rg-live:not(:empty) {
        background: #e8f3e9;
        border: 1px solid #cadfcf;
        color: #22553d;
        padding: 10px 13px;
        border-radius: 7px;
        margin: 0 0 12px;
      }
      .rg-split {
        display: grid;
        grid-template-columns: minmax(0, 1.52fr) minmax(285px, 1fr);
        gap: 15px;
        align-items: start;
      }
      .rg-directory,
      .rg-inspect,
      .rg-form {
        min-width: 0;
        background: #fff;
        border: 1px solid var(--rg-line);
        border-radius: 14px;
        box-shadow: 0 3px 9px #182d1e04;
      }
      .rg-directory {
        overflow: hidden;
      }
      .rg-directory-title {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 17px 9px;
      }
      .rg-app .rg-directory-title h2,
      .rg-app .rg-inspect h2 {
        font-size: 18px;
        font-weight: 660;
        line-height: 1.35;
      }
      .rg-count {
        border-radius: 5px;
        background: #edf2ec;
        color: #516a55;
        min-width: 22px;
        padding: 1px 6px;

              "</p></div></div>" +
              '<form class="rg-form" novalidate><section><div class="rg-form-heading">' +

              '<div class="rg-form-actions"><span role="alert" class="rg-error"></span><button type="button" data-action="back" class="rg-btn">取消</button><button type="submit" class="rg-btn rg-primary">' +

        try {
          for (const key of Object.keys(localStorage)) {
            if (key.startsWith(demoPrefix)) localStorage.removeItem(key);
          }
        } catch {}
        location.reload();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!get("demoInfo").hidden) closeInfo();
          else if (get("side").classList.contains("mobile-open")) setMobileNav(false, true);
        }
        if (e.key === "Tab" && get("side").classList.contains("mobile-open")) {
          const items = [...get("side").querySelectorAll("a,button")].filter(
            (el) => el.offsetWidth,
          );
          if (e.shiftKey && document.activeElement === items[0]) {
            e.preventDefault();
            items.at(-1).focus();
          } else if (!e.shiftKey && document.activeElement === items.at(-1)) {
            e.preventDefault();
            items[0].focus();
          }
        }
      });
      document.addEventListener("click", (e) => {
        if (!get("demoInfo").hidden && !e.target.closest("[data-info],#demoInfo")) showInfo(false);
      });
      smallScreen.addEventListener("change", () => setMobileNav(false));
      window.addEventListener("hashchange", () => renderPage(true));
      renderPage();
    </script>
  </body>
</html>
