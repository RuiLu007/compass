<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptOps · Compass 平台管理</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f8f9f6;
        --surface: #fff;
        --surface-subtle: #f3f6f2;
        --ink: #202b27;
        --muted: #57675f;
        --primary: #1c5145;
        --primary-hover: #153e35;
        --primary-soft: #e5eee7;
        --border: #dce2da;
        --border-strong: #788b80;
        --danger: #a34236;
        --danger-soft: #fff4f1;
        --warning: #745018;
        --warning-soft: #fff4de;
        --focus-ring: #28725e;
        --code-surface: #182620;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.55 var(--font);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      summary,
      label.check,
      button.asset-row {
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
      }
      a {
        color: var(--primary);
      }
      h1,
      h2,
      h3,
      h4,
      p,
      fieldset {
        margin: 0;
      }
      h1 {
        font-size: clamp(32px, 3.2vw, 44px);
        line-height: 1.12;
        letter-spacing: -0.046em;
      }
      h2 {
        font-size: 20px;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      h3 {
        font-size: 17px;
        line-height: 1.4;
      }
      small,
      .meta {
        font-size: 12px;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      code,
      .mono {
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }
      .ico {
        display: inline-block;
        width: 18px;
        height: 18px;
        flex: none;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: fixed;
        z-index: 10;
        top: -80px;
        left: 8px;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 6px;
      }
      .rail {
        position: fixed;
        inset: 0 auto 0 0;
        width: 60px;
        background: #f1f3ef;
        border-right: 1px solid #e4e8e1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        padding: 16px 6px;
        z-index: 2;
      }
      .rail-mark,
      .rail-item {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .rail-mark {
        color: var(--primary);
        margin-bottom: 16px;
      }
      .rail-mark .ico {
        width: 30px;
        height: 30px;
      }
      .rail-item.current {
        background: #dfe8db;
        color: var(--primary);
        border-radius: 11px;
      }
      .rail-rule {
        width: 28px;
        border-top: 1px solid var(--border);
        margin: 8px;
      }
      .rail-profile {
        margin-top: auto;
        background: #dfe8db;
        color: var(--primary);
        border-radius: 50%;
        padding: 7px;
      }
      .side {
        position: fixed;
        inset: 0 auto 0 60px;
        width: 260px;
        background: #f5f7f2;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 14px 18px;
        overflow: auto;
      }
      .side h2 {
        font-size: 21px;
        color: #244537;
        margin: 0 8px 4px;
      }
      .side .caption {
        margin: 0 8px 19px;
        color: var(--muted);
        font-size: 13px;
      }
      .navitem {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        padding: 11px 13px;
        font-size: 14px;
        border-radius: 8px;
      }
      .navitem.current {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 650;
      }
      .side-foot {
        margin-top: auto;
        padding: 24px 10px 0;
        font-size: 13px;
        color: var(--muted);
      }
      .workspace {
        margin-left: 320px;
      }
      .topbar {
        min-height: 66px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px clamp(18px, 3.2vw, 48px);
      }
      .crumb,
      .inline,
      .actions,
      .chips,
      .localmark {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .crumb {
        color: var(--muted);
        font-size: 13px;
      }
      .crumb strong {
        color: var(--ink);
      }
      .crumb .ico {
        width: 15px;
      }
      .localmark {
        font-size: 12px;
        color: var(--muted);
      }
      .identity {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .identity select {
        min-height: 44px;
        background: transparent;
        border: 0;
        font-weight: 600;
        color: var(--ink);
      }
      main {
        max-width: 1580px;
        margin: auto;
        padding: 24px clamp(18px, 3.2vw, 48px) 56px;
        min-width: 0;
      }
      .page-tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        color: var(--muted);
      }
      .page-tabs span {
        padding: 0 0 11px;
      }
      .page-tabs .current {
        color: var(--primary);
        border-bottom: 2px solid var(--primary);
        font-weight: 650;
      }
      .titlebar,
      .panel-head,
      .history-row,
      .between,
      .codebar,
      .actionline {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      .titlebar {
        margin: 24px 0 18px;
        flex-wrap: wrap;
      }
      .titlebar p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 7px;
      }
      .btn,
      .iconbtn,
      .tab,
      .asset-row,
      .kind-filter {
        min-height: 44px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 14px;
        line-height: 1.35;
        font-weight: 600;
        color: var(--primary);
        text-align: center;
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
      }
      .btn:hover:not(:disabled),
      .iconbtn:hover:not(:disabled) {
        background: var(--surface-subtle);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .btn:active:not(:disabled) {
        transform: scale(0.985);
      }
      .iconbtn {
        min-width: 44px;
        display: inline-grid;
        place-items: center;
        border-radius: 8px;
        color: var(--primary);
      }
      dialog {
        width: min(660px, calc(100% - 30px));
        max-height: 88dvh;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0;
        color: var(--ink);
        background: var(--surface);
        box-shadow: 0 18px 58px #14251d29;
      }
      dialog::backdrop {
        background: #14251d63;
      }
      .dialog-inner {
        padding: 22px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 14px;
      }
      .dialog-actions .btn {
        min-width: 80px;
      }
      #dialog-body {
        display: grid;
        gap: 13px;
      }

      .side {
        width: 214px;
      }
      .workspace {
        margin-left: 274px;
      }
      main {
        padding: 12px clamp(18px, 2.5vw, 40px) 32px;
        max-width: 1720px;
      }
      .topbar {
        padding-inline: clamp(18px, 2.5vw, 40px);
      }
      .titlebar {
        margin: 24px 0 18px;
      }
      .titlebar h1 {
        font-size: 38px;
      }
      .tabs {
        display: flex;
        gap: 16px;
        align-items: center;
        border-bottom: 1px solid var(--border);
        margin: 0 0 16px;
      }
      .tabs button,
      .subtabs button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 5px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        border-bottom: 2px solid transparent;
      }
      .tabs button[aria-current="page"],
      .subtabs button[aria-current="page"] {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .tabs .ico {
        width: 16px;
      }
      .count {
        font: 11px var(--mono);
        background: var(--surface-subtle);
        border-radius: 5px;
        padding: 3px 6px;
        color: var(--muted);
      }
      .status:empty {
        display: none;
      }
      .status {
        margin: 10px 0;
        color: var(--primary);
        background: var(--primary-soft);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .status.alert,
      .field-error {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .field-error {
        padding: 6px 9px;
        border-radius: 6px;
        font-size: 13px;
      }
      .panel,
      .library {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        min-width: 0;
      }
      .panel {
        padding: 20px;
      }
      .library {
        display: grid;
        grid-template-columns: minmax(250px, 30%) minmax(0, 1fr);
        overflow: clip;
        min-height: 600px;
      }
      .file-side {
        min-width: 0;
        background: #f6f8f4;
        border-right: 1px solid var(--border);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
      }
      .side-head,
      .file-meta,
      .panel-head,
      .toolbar,
      .tree-root,
      .between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .side-head {
        padding: 0 2px 6px 8px;
      }
      .side-head h2 {
        font-size: 16px;
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 4px 10px;
        padding: 0 9px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
      }
      .searchbox .ico {
        width: 16px;
      }
      .searchbox input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        height: 42px;
        font-size: 14px;
      }
      .tree-root {
        padding: 0 8px;
        color: var(--muted);
        font: 13px var(--mono);
      }
      .tree-root button {
        color: var(--muted);
      }
      .tree-scroll {
        max-height: clamp(420px, 65vh, 850px);
        overflow: auto;
        padding: 4px 3px 8px;
        scrollbar-width: thin;
      }
      .tree-group {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .tree-row {
        width: 100%;
        min-height: 44px;
        padding: 5px 6px 5px calc(5px + var(--depth) * 12px);
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        color: #3b5145;
        line-height: 1.36;
        min-width: 0;
      }
      .tree-row:hover,
      .iconbtn:hover,
      .mini:hover {
        background: var(--primary-soft);
      }
      .tree-row.selected {
        background: #dfece3;
        color: #164b3a;
        box-shadow: inset 3px 0 0 var(--primary);
      }
      .tree-row .ico {
        width: 15px;
        height: 15px;
      }
      .tree-row .angle {
        width: 10px;
        height: 10px;
        flex: 0 0 10px;
      }
      .tree-row[aria-expanded="true"] .angle {
        transform: rotate(90deg);
      }
      .tree-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font: 13px/1.42 var(--mono);
      }
      .alias {
        font: 12px/1.4 var(--font);
        color: var(--muted);
        margin-left: auto;
        white-space: nowrap;
      }
      .dot {
        margin-left: auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a06322;
        flex: none;
      }
      .tree-empty {
        padding: 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .detail {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .detail-head {
        padding: 21px 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .path {
        color: var(--muted);
        font: 12px/1.55 var(--mono);
        overflow-wrap: anywhere;
      }
      .path .ico {
        width: 15px;
        height: 15px;
        margin-right: 5px;
        color: var(--primary);
      }
      .file-meta {
        margin: 10px 0 8px;
        flex-wrap: wrap;
      }
      .file-name {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .file-name h2 {
        font: 650 20px/1.4 var(--mono);
        overflow-wrap: anywhere;
      }
      .file-name .ico {
        color: var(--primary);
      }
      .pill {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 3px 8px;
        font: 12px/1.4 var(--font);
        background: var(--surface-subtle);
        color: var(--muted);
        border-radius: 6px;
      }
      .pill.ok {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .pill.warm {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .usage {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
      .subtabs {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .subtabs button {
        font-size: 13px;
      }
      .editor-area {
        padding: 20px 24px 24px;
        min-width: 0;
      }
      .markdown {
        font: 16px/1.72 var(--font);
        overflow-wrap: anywhere;
        max-width: 80ch;
        color: var(--ink);
      }
      .markdown > * + * {
        margin-top: 0.85em;
      }
      .markdown h1 {
        font: 650 26px/1.35 var(--font);
        letter-spacing: -0.025em;
      }
      .markdown h2 {
        font-size: 18px;
      }
      .markdown h3 {
        font-size: 16px;
      }
      .markdown h2,
      .markdown h3 {
        margin-top: 1.3em;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 1.5em;
      }
      .markdown li + li {
        margin-top: 0.28em;
      }
      .markdown blockquote {
        margin-inline: 0;
        border-left: 3px solid #9bb4a1;
        padding-left: 12px;
        color: var(--muted);
      }
      .markdown table,
      .registry {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .markdown th,
      .markdown td,
      .registry th,
      .registry td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .markdown th,
      .registry th {
        background: var(--surface-subtle);
        font-size: 13px;
      }
      .table-scroll {
        max-width: 100%;
        overflow: auto;
      }
      .markdown pre,
      .source {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 14px;
        background: var(--code-surface);
        color: #e4eee6;
        border-radius: 8px;
        max-width: 100%;
        font: 13px/1.6 var(--mono);
      }
      .markdown pre {
        white-space: pre;
        overflow: auto;
      }
      .markdown :not(pre) > code,
      .var-token {
        background: #edf3ec;
        color: #245342;
        border-radius: 4px;
        padding: 1px 4px;
        font: 0.88em var(--mono);
      }
      .source {
        max-height: 330px;
        overflow: auto;
      }
      .editor {
        width: 100%;
        resize: vertical;
        padding: 14px;
        min-height: 345px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        font: 14px/1.65 var(--mono);
        color: var(--ink);
        background: #fbfcf9;
      }
      .actions {
        gap: 8px;
      }
      .doc-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px solid var(--border);
        margin-top: 22px;
        padding-top: 12px;
      }
      .mini {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-width: 44px;
        min-height: 44px;
        border-radius: 8px;
        color: var(--primary);
        font-size: 13px;
      }
      .mini .ico {
        width: 15px;
        height: 15px;
      }
      .label {
        display: grid;
        gap: 5px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
      }
      .label input,
      .label textarea,
      .label select {
        width: 100%;
        min-width: 0;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: #fff;
        min-height: 44px;
        padding: 9px 10px;
        font-weight: 400;
      }
      .label textarea {
        resize: vertical;
      }
      .dialog-inner .panel-head {
        margin-bottom: 12px;
      }
      .dialog-inner strong,
      .label,
      .history-row,
      .registry td {
        overflow-wrap: anywhere;
      }
      .dialog-actions {
        position: relative;
      }
      .changes {
        display: grid;
        gap: 9px;
      }
      .changes > div,
      .history-row,
      .snapshot-row {
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
      }
      .history-row,
      .snapshot-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .history-row small,
      .snapshot-row small {
        display: block;
        margin-top: 3px;
      }
      .history-row strong,
      .snapshot-row strong {
        margin-right: 8px;
      }
      .subtle {
        font-size: 13px;
        color: var(--muted);
      }
      details > summary {
        min-height: 44px;
        align-content: center;
        color: var(--primary);
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }
      .diff {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .diff h3 {
        font-size: 13px;
      }
      .checkrow {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        overflow-wrap: anywhere;
      }
      .checkrow input {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .disabled-info {
        color: var(--muted);
        font-size: 13px;
      }
      .mobile-tree {
        display: none;
      }
      .skip:focus {
        z-index: 5;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        padding-top: 16px;
      }
      footer .ico {
        width: 15px;
      }
      @media (max-width: 1270px) and (min-width: 901px) {
        .side {
          width: 182px;
        }
        .workspace {
          margin-left: 242px;
        }
        .library {
          grid-template-columns: minmax(235px, 31%) minmax(0, 1fr);
        }
        main,
        .topbar {
          padding-inline: 20px;
        }
      }
      @media (max-width: 1020px) {
        .side {
          display: none;
        }
        .workspace {
          margin-left: 60px;
        }
      }
      @media (max-width: 800px) {
        .library {
          grid-template-columns: minmax(220px, 33%) minmax(0, 1fr);
        }
        .detail-head {
          padding: 16px 16px 0;
        }
        .editor-area {
          padding: 16px;
        }
        .tree-row {
          padding-left: calc(4px + var(--depth) * 8px);
        }
        .tree-name {
          font-size: 12px;
        }
      }
      @media (max-width: 680px) {
        .rail {

    <script type="application/json" id="local-catalog">
{
  "shared/fragments/base.md": "# Compass 经营分析助手\n\n你是 Compass 经营分析助手。沿用用户当前工作空间已确认的指标口径、数据范围和权限。已有信息足够时直接完成任务。缺少会改变结论的条件时，先问最关键的一项。对尚未取得的数据说明缺口。只在产物已生成并可打开时给出入口。\n",
  "shared/fragments/retail.md": "# 零售指标口径\n\n展示查询所用的渠道、统计期间、币种和单位。对齐实付额、订单量和支付笔数各自的定义。\n",
  "shared/skills/metric-check.md": "# 指标口径核对\n\n核实期间、分母、单位与数据来源。需要查数时，沿用当前身份的数据读取权限。\n",
  "shared/skills/report-outline.md": "# 周报提纲\n\n按经营摘要、指标变化、风险与行动建议组织周报。所有关键数字对应已确认的指标与范围。\n",
  "shared/stages/analyze.md": "# 分析\n\n核对分组可比性与分母。解释关键变化时区分观测事实和需要业务复核的原因。\n",
  "shared/stages/generate.md": "# 生成答案\n\n依据已核对的数据和本次交付目标作答。使用对应的输出模板，标明结果可用的范围和截至时间。\n",
  "shared/stages/identify.md": "# 识别交付目标\n\n根据本轮提问和已确认的对话背景，识别经营问答、数据分析、看板创建或经营报告。交付形式仍有歧义时问最关键的一项。\n",
  "shared/stages/plan.md": "# 规划\n\n列出当前问题需要的指标、期间、对照组和可交付的结果，仅使用当前身份获准的能力。\n",
  "shared/stages/query.md": "# 查询\n\n确认字段、单位和统计边界后取得授权数据。记录实际期间、筛选范围、来源和缺项。\n",
  "shared/tools/database-query.md": "# 数据查询\n\n使用获准的数据查询工具查阅必要的表和字段，再执行只读查询。只读取本次任务需要的范围，先核对指标口径。查询失败时说明缺口。\n",
  "support/routing/business.md": "# 业务分析\n\n根据用户提供的信息和授权数据回答。需要取数时先确认数据源和指标定义。说明已完成的工作与仍缺少的信息。\n",
  "support/routing/clarify.md": "# 澄清\n\n问题缺少会改变结论的条件时，只问一项最重要的信息，并给出用户能选择的业务口径。\n",
  "support/routing/classify.md": "# 场景识别\n\n结合历史指代和用户本轮的交付目标，从运行时提供的场景目录选择场景。目录与输出约定由当前调用提供。\n",
  "support/routing/handoff.md": "# 转至管理入口\n\n对需要后台管理或外部操作的请求，指出对应产品入口，并说明用户可在那里完成哪一步。\n",
  "support/routing/off-topic.md": "# 范围外问题\n\n用简短的中文说明 Compass 可处理的经营分析问题，并引导用户说明指标、期间或需要的交付物。\n",
  "support/routing/restricted.md": "# 受限请求\n\n说明当前身份可使用的范围，邀请用户缩小问题范围或通过现有入口申请相应权限。\n",
  "support/session/title.md": "# 会话标题\n\n仅根据用户本轮主题，用相同语言写一行简短标题。写明分析对象或动作，省略个人身份信息、凭据和其他敏感值。\n",
  "support/starters/metric-question.md": "# 经营提问模板\n\n请按渠道列出 {{period}} 的实付额，并说明金额口径。\n",
  "support/subagent/analysis.md": "# 子任务分析\n\n围绕主任务交付的明确子问题使用已获准的工具。返回可供主任务复核的结论、数据口径和局限。\n",
  "tasks/business_qa/scenes/metric_lookup/answer.md": "# 指标快查\n\n先给所问指标的数值、单位和起止日期，再用一句话解释指标口径。\n\n## 数据状态\n\n- 区分已确认的零、暂无记录和数据尚未到齐。\n- 问题只涉及定义时，直接说明已发布的定义。\n",
  "tasks/business_qa/system.md": "# 经营问答\n\n直接回答用户问的指标或定义。问数值时，先给数值、单位和期间，再用一句话解释口径。只问定义时直接解释。遇到同名指标且口径不同，先问清用户要看哪一个。\n\n## 业务与回答约束\n\n采用当前工作空间认可的指标口径和业务日历。“上周”在答案中展开为日期。区分已确认的零、没有记录和数据未到齐。\n\n## 默认组装的上下文清单\n\n- 默认带入当前问题、工作空间与授权范围、业务日历、指标名称及已发布释义。\n- 查数时补入目标期间、可见渠道、数据截至日、汇总值、数据是否到齐。仅问定义时可直接使用指标释义。\n\n## 完成任务的 SOP\n\n1. 区分问定义与问数值，将“上周”展开为具体日期。\n2. 核对指标释义与范围。同名异义时给用户可选择的口径。\n3. 查数时核对数据截至日和完整性，分别处理已确认的零、无记录和未到齐。\n4. 先答所问，再补足日期、单位或退款说明。\n\n## 最终 Answer\n\n第一句给数值或定义，第二句回答会影响理解的口径。数据未到齐时说明可用截止日。指标定义有歧义时只追问这一项。\n\n## 交付产物\n\n对话中保留可重读的文字答复。单次问数或口径解释用正文交付。\n",
  "tasks/business_report/scenes/weekly/finance.md": "# 财务周报摘要\n\n为财务负责人整理 **{{period}}** 的经营周报。金额统一使用 **{{unit}}**。\n\n## 摘要怎么写\n\n- 首行给出本期最重要的财务结论。\n- 实付额按支付成功日期统计，退款单列。\n- 从已核实的渠道变化中选出最值得跟进的一项。\n\n## 交付格式\n\n在对话中给出一至三条摘要，附上完整报告的打开与下载入口。摘要、正文与下载稿使用同一组数字。\n",
  "tasks/business_report/scenes/weekly/report.md": "# 经营周报\n\n面向 **{{audience}}** 汇总 {{period}} 的经营情况，金额用 {{unit}} 表示。\n\n## 正文顺序\n\n1. 经营摘要与本期核心指标。\n2. 相比对照期的变化及可核实的原因。\n3. 风险、待确认事项与下一步行动。\n\n在对话中给出摘要和完整报告入口。\n",
  "tasks/business_report/system.md": "# 经营报告\n\n围绕指定读者和报告期间撰写经营报告。开篇给经营结论，正文列核心指标、关键变化、风险或待核实项和可执行建议。按已发布模板组织内容，金额单位一致。生成完整报告后，在对话中只给摘要与报告入口。\n\n## 业务与回答约束\n\n实绩、目标、预测分别标注。没有已确认目标时略去达成率。没有核实的活动或成本信息时，将相关解释列为待核实项。建议与本期观察对应。\n\n## 默认组装的上下文清单\n\n- 默认带入报告读者与用途、报告期与对比期、部门生效模板、金额单位、授权指标汇总、经核对的分项变化及数据截至日。\n- 报告涉及目标、风险或上期行动时，补入已确认的目标、业务事件或行动进度。缺少的材料记为待核实项。\n\n## 完成任务的 SOP\n\n1. 确认读者、期间、模板和单位。\n2. 汇总可见的实绩、变化与待跟进事项，区分已核实事实和待核实解释。\n3. 按模板撰写全文。把建议对应到具体观察，核对摘要、正文、表格及下载稿的数字。\n4. 保存完整报告并检查可打开、可下载，再向用户交付简短摘要和两个入口。\n\n## 最终 Answer\n\n用一至三条摘要回答读者最关心的变化和待跟进事项，提供“打开报告”和“下载报告”。摘要、正文和下载文件中的关键数字一致。\n\n## 交付产物\n\n保存一份完整、可重开的经营报告，含标题、期间与范围、摘要、指标对比、风险和行动建议。首版以 Markdown（.md）提供可独立阅读的下载稿。\n",
  "tasks/dashboard/scenes/channel_overview/layout.md": "# 渠道概览看板\n\n根据授权数据生成指标卡、趋势和渠道分布。用标题标注各组件的统计期间。\n\n## 交付前核对\n\n- 趋势与占比分别使用正确的时间范围。\n- 保留创建时的筛选和数据截至时间。\n- 保存成功后才提供“打开看板”。\n",
  "tasks/dashboard/system.md": "# 看板创建\n\n围绕用户要观察的指标创建看板。用指标卡展示当前值、折线图展示时间趋势、条形图展示渠道比较或占比。标清期间、单位、筛选范围和缺数。看板保存成功后，在回答中给出打开入口。\n\n## 业务与回答约束\n\n各组件沿用同一指标定义，单独展示某周的组件另标期间。占比写明分母，缺失日期标为缺数。全部组件均缺少可用数据时，提示补充范围或数据。\n\n## 默认组装的上下文清单\n\n- 默认带入看板目的、指标释义、时间范围与粒度、筛选范围、用户点名的组件、数据截至日。\n- 趋势图需要各期数列及缺失标记。结构图需要同一期的分组数值与整体。由追问发起时，带入上轮确认的筛选，并重新核对访问权限。\n\n## 完成任务的 SOP\n\n1. 确定看板要回答的问题，沿用用户确认的筛选，补齐新要求的期间。\n2. 为当前值、趋势和结构分别选择适用组件，逐项核对粒度、单位、分母与缺数。\n3. 生成并保存看板，对照指标卡与图表读数。部分缺数在对应组件说明，全部缺数时请用户调整范围。\n4. 确认可重开后，交付看板卡和关键读数。保存失败时保留问题并提供重试。\n\n## 最终 Answer\n\n给出看板名称、覆盖范围和最值得先看的读数，附“打开看板”。部分组件缺数时指出具体组件。保存失败时给出重试入口。\n\n## 交付产物\n\n一张可从原会话重开的看板卡，包含标题、筛选范围、数据截至时间及用户点名的组件。重开看到创建时的结果和口径。\n",
  "tasks/data_analysis/scenes/period_comparison/answer.md": "# 周期对比\n\n先写整体变化，再指出贡献最大的分项。列出两期数值、差额和贡献分母。\n\n| 列           | 填写要求                   |\n| ------------ | -------------------------- |\n| 本期与对照期 | 明确日期和单位             |\n| 差额         | 以同一范围汇总             |\n| 贡献占比     | 整体增量为零时标为“不适用” |\n",
  "tasks/data_analysis/system.md": "# 数据分析\n\n先确定指标、范围和比较对象。跨期分析对齐期间和口径，分组或排名明确使用的维度。先回答最重要的变化或差异，用对比表列出可核对的数字。解释原因时注明已确认的业务事实和待核实项。\n\n## 业务与回答约束\n\n各分项使用可比的口径、粒度和范围。基期为零时给差额，变化率标为“不适用”。总增量为零时贡献占比同样处理。某个分项缺数时说明对排序或比较的影响。\n\n## 默认组装的上下文清单\n\n- 默认带入分析问题、指标定义、比较对象、期间、分组维度、每组在可见范围内的数值及数据截至日。\n- 跨期分析补入可比基期与两期共同覆盖范围。贡献分析补入整体增量。仅在解释原因时补入已核实的业务事件。\n\n## 完成任务的 SOP\n\n1. 确认用户想比较期间、拆解贡献还是查看单期排名。\n2. 对齐粒度、可比范围与单位，标出缺失分项。\n3. 计算并核对整体与分项。完整互斥的分组应能加回整体。分母为零时保留可计算的差额。\n4. 按用户的问题给出结论和表格。需要导出时，用同一批可见数据生成 CSV。\n\n## 最终 Answer\n\n先回答最重要的差异，再列能复核结论的表格。跨期比较列出分项、两期数值和差额，单期排名列出名次、分项和指标值。计算贡献占比时标明分母。\n\n## 交付产物\n\n对比表随对话保存。用户要求导出时，提供与表中期间、筛选、单位及可见行一致的 CSV。\n"
}
</script>

            if (ui.expanded.size) ui.expanded.clear();
            else
              allDirs(paths())
                .filter(Boolean)
                .forEach((x) => ui.expanded.add(x));
            drawLibrary();
            document.querySelector('[data-action="expand-tree"]')?.focus({ preventScroll: true });
            break;
          case "new":
            newFile();
            break;
          case "cancel-edit":
            ui.buffers.delete(p);
            ui.mode = "preview";
            drawLibrary();
            break;
          case "save-file":
            saveEditor();
            break;
          case "reconcile":
            reconcile();
            break;
          case "sample":
            trySample();
            break;
          case "download":
            download();
            break;
          case "publish-file":
            publishOne();
            break;
          case "inspect-file":
            inspectRevision(p, Number(target.dataset.no));
            break;
          case "recover-file":
            recoverFile(Number(target.dataset.no));
            break;
          case "import":
            openImport();
            break;
          case "bulk":
            bulk();
            break;
          case "inspect-snap":
            inspectSnapshot(target.dataset.id);
            break;
          case "recover-snap":
            restoreSnapshot(target.dataset.id);
            break;
          case "snap-file": {
            const path = target.dataset.path,
              no = Number(target.dataset.no),
              id = target.dataset.id,
              v = revision(record(db, path), no);
            if (!v) break;
            modal(
              id + " · " + version(no),
              `<p class="path">prompts/${safe(path)}</p>${md(v.body)}${btn("inspect-snap", "返回快照 " + id, "layers", "quiet", `data-id="${safe(id)}"`)}`,
            );
            break;
          }
          case "open-error-file":
            stopModal();
            ui.filter = "";
            choose(target.dataset.path);
            ui.mode = "edit";
            draw();
            break;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "tree-search") {
          ui.filter = e.target.value;
          drawTree(false);
        } else if (e.target.id === "edit-text") {
          draftBuffer(ui.path).text = e.target.value;
          $("edit-state").textContent = dirty(ui.path) ? "有未保存的修改" : "修改已与原文一致";
          const publish = $("file-detail").querySelector('[data-action="publish-file"]');
          if (publish) publish.disabled = dirty(ui.path);
          const currentTag = $("file-detail").querySelector(".file-name>.pill");
          if (currentTag) currentTag.outerHTML = tag(ui.path);
          drawTree();
        } else if (e.target.hasAttribute("data-sample")) renderSample();
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "folder-picker") {
          pickDirectory(e.target);
          return;
        }
        if (e.target.id === "identity") {
          stopModal();
          note();
          draw();
        }
      });
      $("dialog-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const state = formState;
        if (!state?.run || state.busy || $("identity").value !== "admin") return;
        state.busy = true;
        const button = $("confirm"),
          old = button?.textContent;
        if (button) {
          button.disabled = true;
          button.textContent = "处理中…";
        }
        err("");
        try {
          await state.run();
        } catch (error) {
          err(error.message);
          try {
            db = read();
          } catch {}
        } finally {
          state.busy = false;
          if (formState === state && button?.isConnected) {
            button.disabled = false;
            button.textContent = old;
          }
        }
      });
      pop.addEventListener("cancel", (e) => {
        if (formState?.busy) e.preventDefault();
      });
      pop.addEventListener("close", () => {
        if (pop.open) return;
        formState = null;
        importSequence++;
        if (refreshAfterClose) {
          refreshAfterClose = false;
          db = read();
          draw();
        }
        (
          (back && document.querySelector(back)) ||
          document.querySelector('.subtabs [aria-current="page"]') ||
          $("main")
        ).focus({ preventScroll: true });
        back = null;
      });
      window.addEventListener("storage", (e) => {
        if (e.key !== key || !e.newValue) return;
        try {
          db = read();
          if (pop.open) {
            refreshAfterClose = true;
            err("另一个窗口已保存变更。本次提交会核对此文件或整库的版本。");
            return;
          }
          const editing = document.activeElement?.id === "edit-text",
            start = editing ? $("edit-text").selectionStart : 0,
            end = editing ? $("edit-text").selectionEnd : 0;
          draw();
          if (editing && $("edit-text")) {
            $("edit-text").focus({ preventScroll: true });
            $("edit-text").setSelectionRange(start, end);
          }
          if ($("identity").value === "admin") note("已载入另一窗口保存的变更。");
        } catch {
          note("无法读取最新文件，请刷新后再试。", true);
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if ([...ui.buffers.keys()].some(dirty)) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      draw();
      if (storeIssue) note("当前浏览器无法读取存储，请启用本地存储后重开。", true);
    </script>
  </body>
</html>
