        }

        img,

        object {

        }

        img,
        video {
          max-width: 100%;

        }

        button,
        input,
        select,
        optgroup,
        textarea {
          font: inherit;
          font-feature-settings: inherit;
          font-variation-settings: inherit;

        }

        ::file-selector-button {
          font: inherit;
          font-feature-settings: inherit;
          font-variation-settings: inherit;
          letter-spacing: inherit;
          color: inherit;
          opacity: 1;
          background-color: #0000;
          border-radius: 0;
        }

        :where(select:is([multiple], [size])) optgroup {

        }

        ::file-selector-button {

        }

        ::placeholder {

        @supports (not ((-webkit-appearance: -apple-pay-button))) or (contain-intrinsic-size: 1px) {
          ::placeholder {

          @supports (color: color-mix(in lab, red, red)) {

        ::-webkit-datetime-edit-year-field {

        }

        ::-webkit-datetime-edit-second-field {
          padding-block: 0;
        }

        ::-webkit-datetime-edit-millisecond-field {
          padding-block: 0;
        }

        ::-webkit-datetime-edit-meridiem-field {
          padding-block: 0;
        }

        ::-webkit-calendar-picker-indicator {
          line-height: 1;
        }

        :-moz-ui-invalid {
          box-shadow: none;
        }

        button,
        input:where([type="button"], [type="reset"], [type="submit"]) {
          appearance: button;
        }

        ::file-selector-button {
          appearance: button;
        }

        ::-webkit-inner-spin-button {
          height: auto;
        }

        ::-webkit-outer-spin-button {
          height: auto;
        }

        [hidden]:where(:not([hidden="until-found"])) {
          display: none !important;
        }
      }

      @layer components;

      @layer utilities {
        .visible {
          visibility: visible;
        }

        .sr-only {
          clip-path: inset(50%);
          white-space: nowrap;
          border-width: 0;
          width: 1px;
          height: 1px;
          margin: -1px;
          padding: 0;
          position: absolute;
          overflow: hidden;
        }

        .absolute {
          position: absolute;
        }

        .fixed {
          position: fixed;
        }

        .\!hidden {
          display: none !important;
        }

        .grid {
          display: grid;
        }

        .hidden {
          display: none;
        }

        .table {
          display: table;
        }

        .transform {
          transform: var(--tw-rotate-x,) var(--tw-rotate-y,) var(--tw-rotate-z,) var(--tw-skew-x,)
            var(--tw-skew-y,);
        }

        .border {
          border-style: var(--tw-border-style);
          border-width: 1px;
        }

        .ordinal {
          --tw-ordinal: ordinal;
          font-variant-numeric: var(--tw-ordinal,) var(--tw-slashed-zero,) var(--tw-numeric-figure,)
            var(--tw-numeric-spacing,) var(--tw-numeric-fraction,);
        }

        .\!filter {
          filter: var(--tw-blur,) var(--tw-brightness,) var(--tw-contrast,) var(--tw-grayscale,)
            var(--tw-hue-rotate,) var(--tw-invert,) var(--tw-saturate,) var(--tw-sepia,)
            var(--tw-drop-shadow,) !important;
        }

        .filter {
          filter: var(--tw-blur,) var(--tw-brightness,) var(--tw-contrast,) var(--tw-grayscale,)
            var(--tw-hue-rotate,) var(--tw-invert,) var(--tw-saturate,) var(--tw-sepia,)
            var(--tw-drop-shadow,);
        }
      }

      :root {
        --lightningcss-light: initial;
        --lightningcss-dark: ;
        color-scheme: light;
        --canvas: #f8f9f6;
        --surface: #fff;
        --surface-subtle: #f3f6f2;
        --ink: #202b27;
        --muted: #62716a;
        --primary: #1c5145;
        --primary-hover: #153e35;
        --primary-soft: #e5eee7;
        --border: #dce2da;
        --border-strong: #788b80;
        --danger: #a34236;
        --danger-soft: #fff4f1;
        --warning: #745018;
        --warning-soft: #fff4de;
        --focus-ring: #28725e;
        --code-surface: #182620;
        --code-toolbar: #22352b;
        --code-border: #385144;
        --code-text: #e1eee5;
        --code-muted: #aec5b6;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --font-code: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --text-meta: 0.75rem;
        --text-control: 0.875rem;
        --text-body: 1rem;
        --text-title: 1.125rem;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-control: 8px;
        --radius-panel: 14px;
        --ui-control-height: 40px;
        --ui-ease: cubic-bezier(0.23, 1, 0.32, 1);
        --ui-fast: 0.14s;
      }

      .ui-panel {
        min-width: 0;
        padding: var(--space-5);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        background: var(--surface);
      }

      .ui-panel h3,
      .ui-dialog h2 {
        color: var(--ink);
        font-size: var(--text-title);
        margin: 0;
        line-height: 1.35;
      }

      .ui-guide .ui-panel h3 {
        font-size: var(--text-control);
        font-weight: 650;
      }

      .ui-panel-description {
        margin: var(--space-1) 0 0;
        color: var(--muted);
        font-size: var(--text-control);
        line-height: 1.55;
      }

      .ui-actions {
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
        display: flex;
      }

      .ui-button,
      .ui-link-button {
        min-height: var(--ui-control-height);
        justify-content: center;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-control);
        background: var(--primary);
        color: var(--surface);
        font-size: var(--text-control);
        text-align: center;
        white-space: normal;
        transition:
          background-color var(--ui-fast) var(--ui-ease),
          border-color var(--ui-fast) var(--ui-ease),
          transform var(--ui-fast) var(--ui-ease);
        border: 1px solid #0000;
        font-weight: 600;
        line-height: 1.35;
        display: inline-flex;
      }

      .ui-button[data-variant="secondary"],
      .ui-link-button {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--primary);
      }

      .ui-button[data-variant="quiet"] {
        color: var(--muted);
        background: none;
      }

      .ui-button[data-variant="danger"] {
        background: var(--danger);
      }

      .ui-button svg,
      .ui-link-button svg {
        flex: none;
      }

      .ui-button:not(:disabled):active,
      .ui-link-button:active {
        transform: scale(0.98);
      }

      .ui-button:disabled {
        opacity: 0.58;
      }

      .ui-button[aria-busy="true"] {
        opacity: 1;
        cursor: progress;
      }

      @media (hover: hover) and (pointer: fine) {
        .ui-button[data-variant="primary"]:not(:disabled):hover {
          background: var(--primary-hover);
        }

        .ui-button[data-variant="secondary"]:not(:disabled):hover,
        .ui-button[data-variant="quiet"]:not(:disabled):hover,
        .ui-link-button:hover {
          background: var(--surface-subtle);
          color: var(--primary);
          text-decoration: none;
        }

        .ui-button[data-variant="danger"]:not(:disabled):hover {
          filter: brightness(0.9);
        }
      }

      .ui-field {
        gap: var(--space-2);
        min-width: 0;
        color: var(--ink);
        font-size: var(--text-control);
        font-weight: 600;
        display: grid;
      }

      .ui-field > label {
        color: inherit;
        font: inherit;
        margin: 0;
        display: block;
      }

      .ui-field .ui-input {
        width: 100%;
        min-height: var(--ui-control-height);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--ink);
        font-size: var(--text-control);
        font-weight: 400;
      }

      .ui-field .ui-input::placeholder {
        color: var(--muted);
      }

      .ui-field-hint {
        color: var(--muted);
        font-size: var(--text-meta);
        font-weight: 400;
      }

      .ui-field .ui-input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .ui-notice {
        align-items: flex-start;
        gap: var(--space-2);
        min-width: 0;
        padding: var(--space-3);
        border-radius: var(--radius-control);
        background: var(--surface-subtle);
        color: var(--ink);
        font-size: var(--text-control);
        margin: 0;
        display: flex;
      }

      .ui-notice[data-tone="success"] {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .ui-notice[data-tone="warning"] {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .ui-notice[data-tone="error"] {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .ui-notice svg {
        flex: none;
        margin-top: 2px;
      }

      .ui-disclosure {
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface);
        min-width: 0;
      }

      .ui-disclosure > summary {
        min-height: var(--ui-control-height);
        justify-content: space-between;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-3);
        border-radius: inherit;
        color: var(--ink);
        cursor: pointer;
        font-size: var(--text-control);
        font-weight: 600;
        list-style: none;
        display: flex;
      }

      .ui-disclosure > summary::-webkit-details-marker {
        display: none;
      }

      .ui-disclosure > summary svg {
        color: var(--muted);
        flex: none;
      }

      .ui-disclosure[open] > summary svg {
        transform: rotate(180deg);
      }

      .ui-disclosure-body {
        min-width: 0;
        padding: 0 var(--space-3) var(--space-3);
      }

      .ui-code {
        border: 1px solid var(--code-border);
        border-radius: var(--radius-control);
        background: var(--code-surface);
        min-width: 0;
        max-width: 100%;
        color: var(--code-text);
        overflow: hidden;
      }

      .ui-code-toolbar {
        justify-content: space-between;
        align-items: center;
        gap: var(--space-1) var(--space-3);
        padding: var(--space-1) var(--space-3);
        border-bottom: 1px solid var(--code-border);
        background: var(--code-toolbar);
        flex-wrap: wrap;
        display: flex;
      }

      .ui-code-title,
      .ui-code-actions {
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
        display: flex;
      }

      .ui-code-title {
        font-size: var(--text-meta);
        overflow-wrap: anywhere;
      }

      .ui-code-title span {
        color: var(--code-muted);
      }

      .ui-code-actions .ui-button {
        gap: var(--space-1);
        min-height: 32px;
        padding: var(--space-1) var(--space-2);
        color: var(--code-text);
        font-size: var(--text-meta);
      }

      .ui-code-actions .ui-button[aria-pressed="true"],
      .ui-code-actions .ui-button:not(:disabled):hover {
        background: var(--code-border);
        color: var(--code-text);
      }

      .ui-code-scroll {
        max-height: 20rem;
        padding: var(--space-3) var(--space-4);
        overscroll-behavior-inline: contain;
        color: inherit;
        font: 0.8125rem / 1.6 var(--font-code);
        tab-size: 2;
        white-space: pre;
        margin: 0;
        overflow: auto;
      }

      .ui-code-scroll[data-wrap="true"] {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .ui-code-scroll code {
        font: inherit;
      }

      .ui-code-feedback {
        padding: var(--space-2) var(--space-3);
        color: var(--code-text);
        font-size: var(--text-meta);
        display: block;
      }

      .ui-button:focus-visible,
      .ui-link-button:focus-visible,
      .ui-field .ui-input:focus-visible,
      .ui-disclosure > summary:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .ui-code .ui-button:focus-visible,
      .ui-code-scroll:focus-visible {
        outline: 2px solid var(--code-muted);
        outline-offset: -3px;
      }

      .ui-dialog {
        width: min(28rem, 100% - 32px);
        max-height: calc(100dvh - 32px);
        margin: auto;
        position: fixed;
        inset: 0;
        overflow: auto;
      }

      .ui-dialog::backdrop {
        background: #14231c6b;
      }

      .ui-dialog .ui-actions {
        margin-top: var(--space-5);
        justify-content: flex-end;
      }

      .ui-guide {
        gap: var(--space-8);
        grid-template-columns: minmax(0, 1fr);
        width: min(100%, 66rem);
        min-width: 0;
        margin-inline: auto;
        display: grid;
      }

      .ui-guide-header {
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        background: var(--surface-subtle);
        padding: clamp(16px, 4vw, 32px);
      }

      .ui-guide-header h1 {
        color: var(--ink);
        letter-spacing: -0.02em;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 650;
      }

      .ui-guide-header p {
        margin-top: var(--space-2);
        color: var(--muted);
      }

      .ui-guide-header nav {
        gap: var(--space-2);
        margin-top: var(--space-4);
        flex-wrap: wrap;
        display: flex;
      }

      .ui-guide-header nav a {
        min-height: var(--ui-control-height);
        padding-inline: var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--primary);
        font-size: var(--text-control);
        align-items: center;
        font-weight: 600;
        display: inline-flex;
      }

      .ui-guide-section {
        gap: var(--space-3);
        scroll-margin-top: var(--space-5);
        grid-template-columns: minmax(0, 1fr);
        display: grid;
      }

      .ui-guide-section > h2 {
        font-size: var(--text-title);
        font-weight: 650;
      }

      .ui-guide-colors,
      .ui-guide-grid {
        gap: var(--space-3);
        display: grid;
      }

      .ui-guide-colors {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 105px), 1fr));
      }

      .ui-guide-colors > div {
        min-width: 0;
        padding: var(--space-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface);
      }

      .ui-guide-swatch {
        height: 40px;
        margin-bottom: var(--space-2);
        border: 1px solid var(--border);
        border-radius: var(--space-1);
        display: block;
      }

      .ui-guide-colors dt {
        font-size: var(--text-control);
        font-weight: 600;
      }

      .ui-guide-colors dd {
        color: var(--muted);
        font: var(--text-meta) / 1.4 var(--font-code);
        overflow-wrap: anywhere;
      }

      .ui-guide-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .ui-guide-example {
        align-content: start;
        gap: var(--space-3);
        grid-template-columns: minmax(0, 1fr);
        min-width: 0;
        display: grid;
      }

      .ui-guide-example .ui-field {
        max-width: 24rem;
      }

      .ui-guide-feedback:empty {
        height: 0;
        margin-top: calc(-1 * var(--space-3));
      }

      .ui-guide-type-body {
        margin-top: var(--space-2);
        font-size: var(--text-body);
        line-height: 1.55;
      }

      .ui-spinner {
        animation: 0.85s linear infinite ui-spin;
      }

      @keyframes ui-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (pointer: coarse) {
        :root {
          --ui-control-height: 44px;
        }

        .ui-code-actions .ui-button {
          min-height: 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ui-button,
        .ui-link-button {
          transition: none;
        }

        .ui-button:active,
        .ui-link-button:active {
          transform: none;
        }

        .ui-spinner {
          animation: none;
        }
      }

      .analysis-process {

      .analysis-run-control-note {

      .analysis-process-toggle,

      .ui-timeline-row {

        align-items: center;
        gap: var(--space-2);
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-control);
        color: var(--muted);
        font: inherit;
        font-size: var(--text-control);
        text-align: left;
        background: none;
        border: 0;
        display: flex;

        white-space: nowrap;
        flex: 1;
        min-width: 0;
        overflow: hidden;

        flex: none;

        gap: var(--space-1);

      .ui-timeline-status[data-status="failed"] {

      }

      .ui-timeline-status:is([data-status="waiting"], [data-status="incomplete"]) {
        color: var(--warning);

      .ui-timeline-chevron {

      .ui-execution-timeline {
        min-width: 0;

        margin: 0;
        list-style: none;
        overflow: auto;

      .ui-timeline-detail {

        color: var(--muted);
        font-size: var(--text-control);

      .ui-timeline-summary {

      }

      .ui-timeline-context {
        font-size: var(--text-meta);
      }

      .ui-timeline-detail .ui-code {
        min-width: 0;
      }

      .ui-timeline-detail .ui-code-toolbar {
        flex-wrap: wrap;

      @media (hover: hover) and (pointer: fine) {
        .analysis-process-toggle:hover,
        button.ui-timeline-row:hover {
          background: var(--surface-subtle);
          color: var(--ink);
        }
      }

      @media (max-width: 600px) {

          margin-inline-start: var(--space-2);

      .analysis-chart {
        border: 1px solid var(--border);

        margin: 1rem 0;
        overflow: hidden;
      }

      .analysis-chart img {
        background: #fff;
        width: 100%;
        height: auto;
        display: block;
      }

      .analysis-chart figcaption {

        padding: 0.75rem 1rem;

      .conversation-row {

      .conversation-row:focus-within {
        --conversation-row-surface: var(--primary-soft);

      }

      .conversation-row:has([aria-current="page"], .conversation-menu-trigger[data-state="open"]) {

        padding: var(--space-2) var(--space-3);

        color: var(--ink);
        flex: 1;
        padding-inline-end: var(--space-1);
        text-decoration: none;
        display: flex;

      .conversation-item > svg {
        flex-shrink: 0;
      }

      .conversation-item:hover {
        text-decoration: none;
      }

      .conversation-title {
        min-width: 0;
        font-size: var(--text-control);
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        font-weight: 500;
        overflow: hidden;

      }

        display: inline-block;

      .conversation-menu-trigger {
        border-radius: var(--radius-control);

        min-height: 44px;
        color: var(--muted);

        place-items: center;
        padding: 0;

        position: absolute;
        inset-block: 0;
        inset-inline-end: 0;

          opacity: 0;
          pointer-events: none;

        .conversation-row:focus-within .conversation-menu-trigger,

      .conversation-menu {

      }

      .durable-approval {

      .schedule-form {
        gap: var(--space-4);

        display: grid;
      }

      .schedule-bar,
      .schedule-filters {
        align-items: flex-end;
        gap: var(--space-3);

        display: flex;

      .schedule-form textarea {

      .schedule-enabled {

        background: #fff;
        font-weight: 600;
        box-shadow: 0 1px 4px #263d320c;
      }

      .sidebar-create-button {
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #fff;
        border-radius: 9px;
        flex-shrink: 0;
        justify-content: flex-start;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 42px;
        min-height: 42px;
        margin: 0 0 15px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 550;
        line-height: 1.5;
        display: flex;
      }

      .sidebar-create-button:hover {
        background: #123b32;
        text-decoration: none;
      }

      .conversation-list {
        scrollbar-width: thin;
        flex: 1;
        min-height: 0;
        margin: 0 -4px;
        padding: 0 4px;
        overflow-y: auto;
      }

      .conversation-empty {
        color: var(--muted);
        padding: 26px 10px;
        font-size: 12px;
      }

      .shell {
        margin-left: calc(var(--rail) + var(--secondary));
        min-height: 100dvh;
      }

      .topbar {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        height: 70px;
        padding: 0 30px;
        display: flex;
      }

      .topbar-left,
      .topbar-right {
        align-items: center;
        gap: 12px;
        display: flex;
      }

      .breadcrumb {
        color: var(--muted);
        white-space: nowrap;
        align-items: center;
        font-size: 12px;
        display: flex;
      }

      .breadcrumb span {
        color: #a7afa7;
        margin: 0 10px;
      }

      .breadcrumb strong {
        color: #3c5147;
        font-weight: 550;
      }

      .context-switch {
        color: #4b5f51;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        display: flex;
      }

      .main {
        min-width: 0;
        max-width: 1600px;
        margin: auto;
        padding: 22px 30px 60px;
      }

      .page-heading {
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0 0 25px;
        display: flex;
      }

      .page-heading .muted {
        margin-top: 8px;
        font-size: 13px;
      }

      .route-tabs {
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        gap: 24px;
        margin-bottom: 24px;
        display: flex;
        overflow-x: auto;
      }

      .route-tabs a {
        color: var(--muted);
        border-bottom: 2px solid #0000;
        padding: 11px 0;
        font-size: 13px;
      }

      .route-tabs a.active {
        color: var(--primary);
        border-color: var(--primary);
        font-weight: 550;
      }

      .route-tabs a:hover {
        color: var(--primary);
        text-decoration: none;
      }

      .sidebar-collapsed .shell {
        margin-left: var(--rail);
      }

      .sidebar-collapsed .secondary-sidebar {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-8px);
      }

      .sidebar-collapsed.nav-preview .secondary-sidebar {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        inset-block: 7px;
        transform: none;
        box-shadow: 10px 8px 32px #1d35201c;
      }

      .mobile-toggle {
        display: none;
      }

      .mobile-nav {
        z-index: 70;
        background: #f5f7f2;
        outline: none;
        grid-template-columns: 56px 1fr;
        width: min(320px, 100vw - 9px);
        display: grid;
        position: fixed;
        inset: 0 auto 0 0;
      }

      .mobile-primary {
        border-right: 1px solid var(--border);
        background: #f1f3ef;
        flex-direction: column;
        align-items: center;
        padding: 15px 5px 13px;
        display: flex;
      }

      .mobile-nav > div {
        flex-direction: column;
        min-width: 0;
        display: flex;
        overflow: auto;
      }

      #mobile-secondary-sidebar {
        border-right: 1px solid #e0e5dc;
      }

      .mobile-nav .secondary-header {
        height: 74px;
      }

      .mobile-nav .secondary-header-actions .icon-button {
        width: 36px;
        min-height: 36px;
      }

      .mobile-nav .rail-tooltip {
        display: none;
      }

      .mobile-nav .sidebar-create-button {
        height: 44px;
        min-height: 44px;
      }

      .mobile-nav .conversation-order button {
        min-height: 36px;
      }

      .module-placeholder {
        border: 1px solid var(--border);
        text-align: center;
        background: #fff;
        border-radius: 12px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 470px;
        padding: 48px 24px;
        display: flex;
      }

      .placeholder-icon {
        color: #6a876e;
        background: #edf2e8;
        border-radius: 18px;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 22px;
        display: grid;
      }

      .module-placeholder h2 {
        margin: 16px 0 10px;
        font-size: 24px;
        font-weight: 550;
      }

      .module-placeholder p {
        color: var(--muted);
        max-width: 480px;
        font-size: 13px;
      }

      .module-placeholder p + p {
        margin-top: 8px;
        font-size: 12px;
      }

      .list-filter {
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        display: flex;
      }

      .list-filter input {
        max-width: 320px;
      }

      .list-filter select {
        width: auto;
        min-width: 120px;
      }

      .table-wrap {
        width: 100%;
        overflow: auto;
      }

      table {
        border-collapse: collapse;
        text-align: left;
        width: 100%;
        min-width: 560px;
        font-size: 13px;
      }

      th {
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        background: #f6f8f3;
        padding: 11px 14px;
        font-size: 11px;
        font-weight: 500;
      }

      td {
        vertical-align: middle;
        border-bottom: 1px solid #e9ede5;
        padding: 14px;
      }

      td.actions {
        display: table-cell;
      }

      td.actions button {
        margin: 3px 5px 3px 0;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .table-sub {
        margin-top: 3px;
        display: block;
      }

      .pagination {
        border-top: 1px solid var(--border);
        color: var(--muted);
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        padding-top: 16px;
        font-size: 12px;
        display: flex;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 42px 18px;
      }

      .empty-state h3 {
        margin: 10px 0 6px;
        font-size: 14px;
        font-weight: 500;
      }

      .empty-state p {
        font-size: 12px;
      }

      .empty-symbol {
        color: #8a9d8a;
        font-size: 30px;
      }

      .workspace-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 20px 0;
        display: grid;
      }

      .workspace-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 20px;
        display: flex;
      }

      .workspace-icon {
        background: var(--primary-soft);
        width: 38px;
        height: 38px;
        color: var(--primary);
        border-radius: 9px;
        place-items: center;
        font-size: 24px;
        display: grid;
      }

      .workspace-card p {
        flex: 1;
        font-size: 12px;
      }

      .workspace-card button {
        width: 100%;
      }

      .details {
        grid-template-columns: 120px 1fr;
        gap: 20px;
        margin: 28px 0;
        display: grid;
      }

      dt {
        color: var(--muted);
        font-size: 13px;
      }

      dd {
        margin: 0;
        font-size: 14px;
      }

      .narrow-panel {
        max-width: 760px;
      }

      .device-label {
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 260px;
        display: block;
        overflow: hidden;
      }

      .metric p {
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        margin-top: 12px;
        font-size: 36px;
        font-weight: 500;
        line-height: 1.4;
        display: block;
      }

      .notification-list article {
        border-bottom: 1px solid var(--border);
        align-items: center;
        gap: 14px;
        padding: 18px 0;
        display: flex;
      }

      .notification-list article:last-child {
        border-bottom: 0;
      }

      .notification-list article > div {
        flex: 1;
      }

      .notification-list strong {
        font-size: 13px;
        font-weight: 500;
      }

      .notification-list p {
        color: var(--muted);
        font-size: 11px;
      }

      .unread-dot,
      .read-dot {
        background: #448ee4;
        border-radius: 50%;
        flex-shrink: 0;
        width: 6px;
        height: 6px;
      }

      .read-dot {
        background: #c3cdc2;
      }

      .audit-filters {
        flex-wrap: wrap;
        align-items: end;
        gap: 10px;
        margin: 20px 0;
        display: flex;
      }

      .audit-filters label {
        flex: 1;
        min-width: 130px;
        margin: 0;
      }

      .audit-filters a {
        padding: 8px;
      }

      .mono {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }

      .dialog-overlay {
        z-index: 60;
        background: #15271d55;
        position: fixed;
        inset: 0;
      }

      .dialog {
        border: 1px solid var(--border);
        z-index: 70;
        background: #fff;
        border-radius: 13px;
        outline: none;
        flex-direction: column;
        width: min(540px, 100vw - 32px);
        max-height: 88dvh;
        display: flex;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 24px 100px #17352b33;
      }

      .dialog-wide {
        width: min(800px, 100vw - 32px);
      }

      .dialog-head {
        border-bottom: 1px solid var(--border);
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding: 22px 24px 18px;
        display: flex;
      }

      .dialog-head h2 {
        font-size: 18px;
      }

      .dialog-head p {
        color: var(--muted);
        margin-top: 6px;
        font-size: 12px;
      }

      .dialog-body {
        min-height: 0;
        padding: 24px;
        overflow: auto;
      }

      .dialog-actions {
        border-top: 1px solid var(--border);
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
        padding-top: 20px;
        display: flex;
      }

      .form-grid {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        display: grid;
      }

      .permission-summary {
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        display: flex;
      }

      .permission-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px 16px;
        margin-top: 14px;
        display: grid;
      }

      .check-field {
        border: 1px solid #e5eae2;
        border-radius: 7px;
        flex-direction: row;
        align-items: flex-start;
        gap: 10px;
        margin: 0;
        padding: 12px;
        font-size: 12px;
        display: flex;
      }

      .check-field input {
        flex-shrink: 0;
        margin-top: 3px;
      }

      .check-field small {
        overflow-wrap: anywhere;
        margin-top: 3px;
        font-size: 10px;
        display: block;
      }

      .template-row {
        align-items: end;
        gap: 8px;
        margin: 18px 0;
        display: flex;
      }

      .template-row label {
        flex: 1;
        margin: 0;
      }

      .permission-inherited {
        border-top: 1px solid var(--border);
        margin-top: 22px;
        padding-top: 22px;
      }

      .chips {
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
        display: flex;
      }

      .chip {
        border: 1px solid var(--border);
        color: var(--muted);
        background: #f1f4ed;
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 11px;
      }

      .confirm-panel {
        background: #edf3e8;
        border: 1px solid #cdddc8;
        border-radius: 9px;
        margin-top: 20px;
        padding: 18px;
      }

      .confirm-panel p {
        margin-top: 8px;
        font-size: 12px;
      }

      .dropdown {
        border: 1px solid var(--border);
        z-index: 80;
        background: #fff;
        border-radius: 10px;
        min-width: 210px;
        padding: 6px;
        box-shadow: 0 12px 40px #17352b22;
      }

      .dropdown [role="menuitem"] {
        color: var(--ink);
        cursor: pointer;
        border-radius: 5px;
        outline: none;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        font-size: 12px;
        display: flex;
      }

      .dropdown [data-highlighted] {
        background: var(--primary-soft);
        text-decoration: none;
      }

      .dropdown [role="separator"] {
        background: var(--border);
        height: 1px;
        margin: 6px 0;
      }

      .menu-caption {
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 550;
      }

      .menu-caption small {
        margin-top: 3px;
        display: block;
      }

      .search-results {
        max-height: 45dvh;
        margin: 16px -8px;
        overflow: auto;
      }

      .search-results a {
        color: var(--ink);
        border-radius: 8px;
        align-items: center;
        gap: 12px;
        padding: 12px;
        display: flex;
      }

      .search-results a.selected {
        background: #edf3e8;
      }

      .search-results span {
        flex: 1;
        font-size: 13px;
      }

      .search-results small {
        margin-top: 3px;
        display: block;
      }

      .toast {
        border: 1px solid var(--border);
        z-index: 80;
        background: #fff;
        border-radius: 8px;
        padding: 14px 20px;
        position: fixed;
        bottom: 24px;
        right: 24px;
        box-shadow: 0 6px 24px #17352b22;
      }

      .analysis-error-toast {
        overflow-wrap: anywhere;
        width: fit-content;
        max-width: min(480px, 100% - 32px);
        margin: 0 auto;
        inset: 16px 16px auto;
      }

      .safe-state {
        text-align: center;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        min-height: 100dvh;
        padding: 24px;
        display: flex;
      }

      .safe-state p {
        max-width: 560px;
        color: var(--muted);
      }

      .brand-mark {
        background: var(--primary);
        color: #fff;
        border-radius: 13px;
        place-items: center;
        width: 48px;
        height: 48px;
        font-size: 26px;
        display: grid;
      }

      .login-page {
        grid-template-columns: 1.1fr 1fr;
        min-height: 100dvh;
        display: grid;
      }

      .login-visual {
        color: #e4f1d6;
        background: #133c30;
        flex-direction: column;
        justify-content: space-between;
        padding: 42px 48px;
        display: flex;
        position: relative;
        overflow: hidden;
      }

      .login-brand {
        letter-spacing: -0.7px;
        color: #f0f8e6;
        z-index: 1;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        display: flex;
      }

      .login-statement {
        z-index: 1;
        margin: 70px 0;
      }

      .login-statement > p:first-child {
        letter-spacing: 2.2px;
        color: #9abb9d;
        font-size: 10px;
      }

      .login-statement h1 {
        letter-spacing: -2px;
        margin: 20px 0 25px;
        font-size: clamp(38px, 4vw, 62px);
        font-weight: 500;
        line-height: 1.3;
      }

      .login-statement > p:last-child {
        color: #c3d8bc;
        font-size: 14px;
      }

      .login-visual footer {
        color: #a3bda3;
        z-index: 1;
        justify-content: space-between;
        font-size: 11px;
        display: flex;
      }

      .login-lines {
        pointer-events: none;
        background: repeating-radial-gradient(
          at 90% 80%,
          #0000 0 27px,
          #a4c88a19 28px 29px,
          #0000 30px
        );
        width: 120%;
        height: 120%;
        position: absolute;
        top: 5%;
        left: 10%;
        transform: rotate(-20deg);
        -webkit-mask-image: linear-gradient(90deg, #0000, #000);
        mask-image: linear-gradient(90deg, #0000, #000);
      }

      .login-panel {
        background: #fbfcf9;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 40px;
        display: flex;
        position: relative;
      }

      .login-panel > div {
        width: 100%;
        max-width: 360px;
      }

      .login-panel h2 {
        margin: 8px 0 10px;
        font-size: 27px;
        font-weight: 550;
      }

      .login-panel > div > p.muted {
        font-size: 13px;
      }

      .login-form {
        margin-top: 34px;
      }

      .login-form label {
        margin-bottom: 20px;
        font-size: 13px;
      }

      .login-form input {
        min-height: 44px;
      }

      .login-form > button {
        width: 100%;
        min-height: 44px;
        margin-top: 5px;
      }

      .login-form > .muted {
        text-align: center;
        margin-top: 18px;
        font-size: 11px;
      }

      .login-form .error {
        margin: 0 0 12px;
      }

      .login-panel footer {
        color: #92a08f;
        font-size: 11px;
        position: absolute;
        bottom: 28px;
      }

      @media (min-width: 1600px) {
        .main {
          padding-inline: 45px;
        }
      }

      @media (max-width: 1180px) {
        :root {
          --secondary: 246px;
        }

        .topbar {
          padding: 0 22px;
        }

        .main {
          padding: 22px;
        }

        .card-grid,
        .workspace-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 900px) {
        .shell,
        .sidebar-collapsed .shell {
          margin-left: var(--rail);
        }

        .secondary-sidebar {
          visibility: hidden;
          pointer-events: none;
          opacity: 0;
        }

        .nav-preview .secondary-sidebar {
          visibility: visible;
          opacity: 1;
          pointer-events: auto;
          border: 1px solid var(--border);
          border-radius: 0 12px 12px 0;
          inset-block: 7px;
          box-shadow: 10px 8px 32px #1d35201c;
        }

        .mobile-toggle {
          display: inline-flex;
        }

        .login-visual {
          padding: 30px;
        }

        .login-panel {
          padding: 32px;
        }

        .login-statement h1 {
          font-size: 40px;
        }
      }

      @media (max-width: 720px) {
        body {
          font-size: 16px;
        }

        .primary-rail,
        .secondary-sidebar,
        .nav-preview .secondary-sidebar {
          display: none;
        }

        .shell,
        .sidebar-collapsed .shell {
          margin-left: 0;
        }

        .topbar {
          height: 62px;
          padding: 0 15px;
        }

        .breadcrumb {
          font-size: 11px;
        }

        .breadcrumb span {
          margin: 0 5px;
        }

        .topbar-left,
        .topbar-right {
          gap: 4px;
        }

        .topbar-right > .icon-button:last-child {
          display: none;
        }

        .context-switch {
          white-space: nowrap;
          text-overflow: ellipsis;
          max-width: 120px;
          font-size: 11px;
          overflow: hidden;
        }

        .main {
          padding: 18px 18px 42px;
        }

        h1 {
          font-size: 25px;
        }

        .page-heading {
          margin-bottom: 20px;
        }

        .page-heading .muted {
          font-size: 12px;
        }

        .panel {
          padding: 18px;
        }

        .card-grid,
        .workspace-grid {
          grid-template-columns: 1fr;
        }

        .section-heading {
          align-items: flex-start;
        }

        .route-tabs {
          gap: 20px;
        }

        .route-tabs a {
          min-height: 44px;
        }

        .module-placeholder {
          min-height: 390px;
          padding: 32px 18px;
        }

        .module-placeholder h2 {
          font-size: 22px;
        }

        button,
        .button,
        .icon-button {
          min-height: 44px;
        }

        .icon-button {
          width: 44px;
        }

        .list-filter {
          flex-wrap: wrap;
        }

        .list-filter input {
          flex: 1;
          min-width: 130px;
          max-width: none;
        }

        .list-filter select {
          min-width: 100px;
          font-size: 13px;
        }

        input,
        select,
        textarea {
          font-size: 16px;
        }

        .details {
          grid-template-columns: 90px 1fr;
          gap: 18px;
        }

        .dialog {
          width: calc(100vw - 24px);
          max-height: 92dvh;
        }

        .dialog-head,
        .dialog-body {
          padding: 18px;
        }

        .permission-grid,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .permission-summary {
          align-items: flex-start;
        }

        .template-row {
          flex-wrap: wrap;
        }

        .template-row label {
          flex-basis: 100%;
        }

        .login-page {
          grid-template-columns: 1fr;
        }

        .login-visual {
          min-height: 240px;
          padding: 24px;
        }

        .login-statement {
          margin: 26px 0 0;
        }

        .login-statement h1 {
          margin: 12px 0 18px;
          font-size: 32px;
          line-height: 1.2;
        }

        .login-statement h1 br,
        .login-visual footer,

[2]\u003c/button>。按当前报价订体验档后，保留 \u003cstrong>14,000 元\u003c/strong> \u003cbutton class=\"lesson-ref\" data-ref=\"2\" aria-label=\"查看引用 订后保留 14,000 元\">[3]\u003c/button>。请华东渠道经理提请签批。\u003c/p>\n\u003ch3>经营走势 \u003cbutton class=\"lesson-ref\" data-ref=\"3\" aria-label=\"查看引用 三个月的经营走势\">[4]\u003c/button>\u003c/h3>\n\u003cp>9 月净额较 8 月回升，仍低于 7 月。\u003c/p>\n\u003cdiv class=\"analysis-markdown-table\" tabindex=\"0\" role=\"region\" aria-label=\"数据表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth>月份\u003c/th>\u003cth style=\"text-align:right\">支付 GMV（元）\u003c/th>\u003cth style=\"text-align:right\">退款（元）\u003c/th>\u003cth style=\"text-align:right\">净 GMV（元）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>7 月\u003c/td>\u003ctd style=\"text-align:right\">352,968.20\u003c/td>\u003ctd style=\"text-align:right\">59,232.15\u003c/td>\u003ctd style=\"text-align:right\">293,736.05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 月\u003c/td>\u003ctd style=\"text-align:right\">73,684.75\u003c/td>\u003ctd style=\"text-align:right\">53,874.05\u003c/td>\u003ctd style=\"text-align:right\">19,810.70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9 月\u003c/td>\u003ctd style=\"text-align:right\">204,550.95\u003c/td>\u003ctd style=\"text-align:right\">23,710.75\u003c/td>\u003ctd style=\"text-align:right\">180,840.20\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>履约与承接 \u003cbutton class=\"lesson-ref\" data-ref=\"4\" aria-label=\"查看引用 实际恢复情况\">[5]\u003c/button>\u003c/h3>\n\u003cp>9 月 16 日原采购实收 400 件。恢复窗内有 52 单支付，最近日结可用 406 件；付费引流收益待试投验证。\u003c/p>\n\u003cdiv class=\"analysis-markdown-table\" tabindex=\"0\" role=\"region\" aria-label=\"数据表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth>苏州仓 · 黑色 EU 42\u003c/th>\u003cth style=\"text-align:right\">9.7–9.11 故障窗\u003c/th>\u003cth style=\"text-align:right\">9.16–9.20 恢复窗\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>锁库短缺 / 尝试\u003c/td>\u003ctd style=\"text-align:right\">68 / 68\u003c/td>\u003ctd style=\"text-align:right\">0 / 57 " aria-label=\"查看引用 三个月的经营走势\">[2]\u003c/button>\u003c/h3>\n\u003cp>9 月净额较 8 月回升，仍低于 7 月。\u003c/p>\n\u003cdiv class=\"analysis-markdown-table\" tabindex=\"0\" role=\"region\" aria-label=\"数据表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth>月份\u003c/th>\u003cth style=\"text-align:right\">支付 GMV（元）\u003c/th>\u003cth style=\"text-align:right\">退款（元）\u003c/th>\u003cth style=\"text-align:right\">净 GMV（元）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>7 月\u003c/td>\u003ctd style=\"text-align:right\">352,968.20\u003c/td>\u003ctd style=\"text-align:right\">59,232.15\u003c/td>\u003ctd style=\"text-align:right\">293,736.05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 月\u003c/td>\u003ctd style=\"text-align:right\">73,684.75\u003c/td>\u003ctd style=\"text-align:right\">53,874.05\u003c/td>\u003ctd style=\"text-align:right\">19,810.70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9 月\u003c/td>\u003ctd style=\"text-align:right\">204,550.95\u003c/td>\u003ctd style=\"text-align:right\">23,710.75\u003c/td>\u003ctd style=\"text-align:right\">180,840.20\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>履约与承接 \u003cbutton class=\"lesson-ref\" data-ref=\"4\" aria-label=\"查看引用 实际恢复情况\">[3]\u003c/button>\u003c/h3>\n\u003cp>9 月 16 日原采购实收 400 件。恢复窗内有 52 单支付，最近日结可用 406 件；付费引流收益待试投验证。\u003c/p>\n\u003cdiv class=\"analysis-markdown-table\" tabindex=\"0\" role=\"region\" aria-label=\"数据表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth>苏州仓 · 黑色 EU 42\u003c/th>\u003cth style=\"text-align:right\">9.7–9.11 故障窗\u003c/th>\u003cth style=\"text-align:right\">9.16–9.20 恢复窗\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>锁库短缺 / 尝试\u003c/td>\u003ctd style=\"text-align:right\">68 / 68\u003c/td>\u003ctd style=\"text-align:right\">0 / 57\u003c/td>\u003c/tr>\u003ctr>\u003ctd>支付订单\u003c/td>\u003ctd style=\"text-align:right\">0\u003c/td>\u003ctd style=\"text-align:right\">52\u003c/td>\u003c/tr>\u003ctr>\u003ctd>活动标记会话\u003c/td>\u003ctd style=\"text-align:right\">0\u003c/td>\u003ctd style=     <script>
      const { pages, facts, docs } = JSON.parse(document.querySelector("#sample").textContent),
        surface = document.querySelector("#surface"),
        dialog = document.querySelector("dialog");
      let current = "normal",
        timer;
      function notice() {
        const el = document.querySelector("#note");
        el.hidden = false;
        el.textContent = "此处为离线原型。可切换场景、展开分析过程或查看回答引用。";
        clearTimeout(timer);
        timer = setTimeout(() => (el.hidden = true), 3200);
      }
      function render(m, focus = false) {
        current = m;
        surface.innerHTML = pages[m];
        const label = document.createElement("label");
        label.className = "lesson-switch";
        label.innerHTML =
          '原型场景<select aria-label="原型场景"><option value="normal">已核实 · 待签批</option><option value="running">检索中</option><option value="missing">缺少有效报价</option><option value="revoked">回看时已撤权</option></select>';
        surface.querySelector(".new-chat-button").before(label);
        const sel = label.querySelector("select");
        sel.value = m;
        sel.onchange = () => render(sel.value, true);
        if (focus) sel.focus();
        surface.querySelector("textarea").readOnly = true;
        surface.querySelector(".model-chat-history").scrollTop = 0;
      }
      surface.onclick = (e) => {
        const btn = e.target.closest("button,a");
        if (!btn) return;
        if (btn.matches(".lesson-ref")) {
          const [title, calc, keys] = facts[+btn.dataset.ref];
          document.querySelector("#source-title").textContent = title;
          document.querySelector("#evidence").innerHTML =
            '<p class="lesson-eq">' +
            calc +
            "</p>" +
            keys
              .map(
                (k) =>
                  '<section class="lesson-source"><small>' +
                  docs[k][0] +
                  "</small><h3>" +
                  docs[k][1] +
                  "</h3><p>" +
                  docs[k][2] +
                  "</p></section>",
              )
              .join("");
          dialog.showModal();
          return;
        }
        if (btn.matches(".analysis-process-toggle")) {
          const el = document.getElementById(btn.getAttribute("aria-controls"));
          el.hidden = !el.hidden;
          btn.setAttribute("aria-expanded", String(!el.hidden));
          return;
        }
        e.preventDefault();
        notice();
      };
      surface.onsubmit = (e) => {
        e.preventDefault();
        notice();
      };
      dialog.querySelector("button").onclick = () => dialog.close();
      dialog.onclose = () => document.querySelector("#evidence").replaceChildren();
      render("normal");
    </script>
