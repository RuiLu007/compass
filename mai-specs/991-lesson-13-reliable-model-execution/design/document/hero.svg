<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="hero-diagram-title hero-diagram-desc">
  <title id="hero-diagram-title">一个逻辑调用，两次有序尝试</title>
  <desc id="hero-diagram-desc">一个 call_id 持有配置快照和绝对截止时间。第一次尝试收到临时拒绝，短暂退避后执行第二次尝试，最后汇总为一个结果。</desc>
  <defs>
    <marker id="hero-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6" fill="none" stroke="#6b8767" stroke-width="1.3" />
    </marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif">
    <rect x="24" y="14" width="432" height="69" rx="8" fill="#234b3d" />
    <text x="43" y="42" font-size="18" fill="#fff">Logical Call</text>
    <text x="43" y="66" font-size="12" fill="#d7e6d0">一个 call_id · 同一份快照 · 同一个 Deadline</text>
    <path d="M240 83 V108 H120 V124 M240 108 H360 V124" stroke="#6b8767" fill="none" />
    <rect x="24" y="124" width="191" height="99" rx="8" fill="#fff" stroke="#cbd9c3" />
    <text x="43" y="151" font-size="15" fill="#23462f">Attempt 1</text>
    <text x="43" y="175" font-size="12" fill="#526b4c">一次 SDK 推理</text>
    <rect x="41" y="188" width="94" height="24" rx="12" fill="#f5eee2" />
    <text x="88" y="205" text-anchor="middle" font-size="11" fill="#825e30">429 / 5xx</text>
    <path d="M215 172 H260" stroke="#6b8767" marker-end="url(#hero-arrow)" />
    <text x="239" y="155" text-anchor="middle" font-size="11" fill="#526b4c">退避</text>
    <rect x="265" y="124" width="191" height="99" rx="8" fill="#fff" stroke="#cbd9c3" />
    <text x="284" y="151" font-size="15" fill="#23462f">Attempt 2</text>
    <text x="284" y="175" font-size="12" fill="#526b4c">同 Provider · 同输入</text>
    <rect x="282" y="188" width="90" height="24" rx="12" fill="#d7edb4" />
    <text x="327" y="205" text-anchor="middle" font-size="11" fill="#34502a">完整结果</text>
    <path d="M120 223 V251 H360 V223 M240 251 V275" stroke="#6b8767" fill="none" marker-end="url(#hero-arrow)" />
    <rect x="87" y="279" width="306" height="37" rx="18" fill="#d7edb4" stroke="#bacf99" />
    <text x="240" y="303" text-anchor="middle" font-size="13" fill="#34502a">一个 final · 有序尝试摘要</text>
  </g>
</svg>
