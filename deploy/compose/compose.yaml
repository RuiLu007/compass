name: compass
services:
  home:
    profiles: [home]
    build:
      context: ../..
      dockerfile: deploy/containers/home.Dockerfile
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "127.0.0.1:8101:8101"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8101/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: pgvector/pgvector:pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: compass
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/containers/agent.Dockerfile
    environment:
      DATABASE_URL: ${COMPASS_AGENT_RUNTIME_URL:-postgresql+psycopg://compass_agent_runtime:compass_agent_runtime_local_only@postgres:5432/compass_agent}
      AGENT_MIGRATION_DATABASE_URL: ${COMPASS_AGENT_MIGRATOR_URL:-postgresql+psycopg://compass_agent_migrator:compass_agent_migration_local_only@postgres:5432/compass_agent}
      AGENT_PROVISION_DATABASE_URL: postgresql://compass:compass_local_only@postgres:5432/compass
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "/bin/sh",
        "-c",
        "python scripts/database.py provision && python scripts/database.py migrate && python -m compass_agent.seed",
      ]
  agent:
    env_file:
      - path: ../../work/observability/agent.env
        required: false
    stop_grace_period: 45s
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/containers/agent.Dockerfile
    environment:
      DATABASE_URL: ${COMPASS_AGENT_RUNTIME_URL:-postgresql+psycopg://compass_agent_runtime:compass_agent_runtime_local_only@postgres:5432/compass_agent}
      COMPASS_DEMO_ENABLED: "true"
      COMPASS_AGENT_SERVICE_TOKEN: ${COMPASS_AGENT_SERVICE_TOKEN:-}
      COMPASS_MODEL_ENCRYPTION_KEY: ${COMPASS_MODEL_ENCRYPTION_KEY:-}
      COMPASS_MODEL_ALLOWED_ORIGINS: ${COMPASS_MODEL_ALLOWED_ORIGINS:-https://api.deepseek.com}
      COMPASS_MODEL_MAX_CONCURRENCY: ${COMPASS_MODEL_MAX_CONCURRENCY:-8}
      COMPASS_MODEL_MAX_INFLIGHT: ${COMPASS_MODEL_MAX_INFLIGHT:-32}
      COMPASS_RETAIL_RUN_SCOPE: ${COMPASS_RETAIL_RUN_SCOPE:-}
      COMPASS_RETAIL_RUN_READONLY_DSN: ${COMPASS_RETAIL_RUN_READONLY_DSN:-}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    ports:
      - "127.0.0.1:8102:8102"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web-migrate:
    profiles: [app, web]
    build:
      context: ../..
      dockerfile: deploy/containers/web.Dockerfile
      target: database-tools
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      WEB_PROVISION_DATABASE_URL: postgresql://compass:compass_local_only@postgres:5432/compass
      WEB_MIGRATION_DATABASE_URL: postgresql://compass_web_migrator:compass_web_migration_local_only@postgres:5432/compass_web
      WEB_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@postgres:5432/compass_web
    depends_on:
      postgres:
        condition: service_healthy
  web:
    env_file:
      - path: ../../work/observability/web.env
        required: false
    profiles: [app, web]
    build:
      context: ../..
      dockerfile: deploy/containers/web.Dockerfile
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      AGENT_API_URL: http://agent:8102
      COMPASS_AGENT_SERVICE_TOKEN: ${COMPASS_AGENT_SERVICE_TOKEN:-}
      COMPASS_DEMO_ENABLED: "true"
      WEB_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@postgres:5432/compass_web
      WEB_PUBLIC_ORIGIN: http://127.0.0.1:8100
      WEB_AUTH_ALLOW_LOCAL_HTTP: "true"
      HOSTNAME: 0.0.0.0
      PORT: "8100"
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  memory:
    profiles: [memory]
    build:
      context: ../..
      dockerfile: deploy/containers/memory.Dockerfile
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    profiles: [worker]
    build:
      context: ../..
      dockerfile: deploy/containers/worker.Dockerfile
    init: true
    stop_grace_period: 10s
volumes:
  postgres-data:
