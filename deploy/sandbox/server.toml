[server]
host = "0.0.0.0"
port = 8112
eip = "127.0.0.1"

[log]
level = "WARNING"

[runtime]
type = "docker"
execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.1.0@sha256:6cf7dba2f21f0b536e100563d841ac58a9f31c2b0a081b7ac76796a24d6f47e2"

[egress]
mode = "dns+nft"
disable_ipv6 = true
image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:v1.1.7@sha256:db7345d567b0970f384b8e3fa7a93a71b7f43d4b16bb2009de34096e9a87b3b5"
readiness_timeout_seconds = 10.0

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
publish_host = "127.0.0.1"
port_range_min = 20000
port_range_max = 29999
pids_limit = 64
drop_capabilities = ["ALL"]
no_new_privileges = true
api_timeout = 30

[ingress]
mode = "direct"
