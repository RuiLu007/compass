[project]
name = "compass-agent"
version = "0.1.0"
description = "Compass agent service and domain API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "litellm-core==1.106.6",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "cryptography>=44,<47",
  "jsonschema>=4.23,<5",
  "boto3>=1.35,<2",
  "google-auth>=2,<3",
  "azure-identity>=1,<2",
  "mcp>=2,<3",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_agent"]
