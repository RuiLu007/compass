[project]
name = "compass-worker"
version = "0.1.0"
description = "Compass HTTP Run consumer"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<0.29"]

[project.scripts]
compass-worker = "compass_worker.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_worker"]
